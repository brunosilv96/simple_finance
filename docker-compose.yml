services:

  postgres:
    image: postgres:17.1-alpine
    container_name: simple-finance-postgres
    environment:
      POSTGRES_DB: simple_finance
      POSTGRES_PASSWORD: 123456
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: